name: ZenHR Monorepo CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Lint, Typecheck & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zenhr
          POSTGRES_PASSWORD: zenhr_password
          POSTGRES_DB: zenhr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./apps/backend/prisma/schema.prisma

      - name: Backend Typecheck
        run: npm run typecheck --workspace=apps/backend

      - name: Frontend Typecheck
        run: npm run typecheck --workspace=apps/frontend

      - name: Execute Full Monorepo Test Suite
        env:
          DATABASE_URL: postgresql://zenhr:zenhr_password@localhost:5432/zenhr_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-chars-long
          TOTP_ENCRYPTION_KEY: test-totp-encryption-key-32-chars-long!
        run: npm run test --workspace=apps/backend -- --runInBand --coverage
