name: ZenHR Monorepo CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://zenhr:zenhr_password@127.0.0.1:5432/zenhr_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zenhr
          POSTGRES_PASSWORD: zenhr_password
          POSTGRES_DB: zenhr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./apps/backend/prisma/schema.prisma

      - name: Lint Both Applications
        run: npm run lint

      - name: Backend Typecheck
        run: npm run typecheck --workspace=apps/backend

      - name: Frontend Typecheck
        run: npm run typecheck --workspace=apps/frontend

      - name: Migrate and Seed Test Database
        env:
          NODE_ENV: test
        run: |
          npm run prisma:migrate:deploy --workspace=apps/backend
          npm run prisma:seed --workspace=apps/backend

      - name: Backend Unit Tests
        run: npm run test --workspace=apps/backend -- --runInBand --coverage

      - name: Build Both Applications
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser and PostgreSQL Regression Tests
        env:
          API_BIND_HOST: 127.0.0.1
          FRONTEND_URL: http://localhost:3000
        run: |
          export ZENHR_E2E_DATABASE_URL="$DATABASE_URL"
          TOTP_ENCRYPTION_KEY=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64'))")
          export TOTP_ENCRYPTION_KEY
          (cd apps/backend && NODE_ENV=development exec node dist/src/main.js) > "$RUNNER_TEMP/zenhr-api.log" 2>&1 &
          api_pid=$!
          (cd apps/frontend && exec node ../../node_modules/next/dist/bin/next start --hostname localhost) > "$RUNNER_TEMP/zenhr-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT

          if ! curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:4000/api/docs > /dev/null ||
             ! curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 http://localhost:3000/login > /dev/null; then
            cat "$RUNNER_TEMP/zenhr-api.log" "$RUNNER_TEMP/zenhr-web.log"
            exit 1
          fi

          npm run test:e2e -- --project chromium
