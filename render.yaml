services:
  # Backend API Web Service (Persistent container for Socket.IO, BullMQ, and Cron jobs)
  - type: web
    name: zenhr-backend-api
    runtime: node
    plan: standard
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate --schema=./apps/backend/prisma/schema.prisma && npm run build --workspace=apps/backend
    preDeployCommand: npm run prisma:migrate:deploy --workspace=apps/backend
    startCommand: npm run start:prod --workspace=apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: zenhr-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: zenhr-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true

  # Frontend Web Service
  - type: web
    name: zenhr-frontend-web
    runtime: node
    plan: standard
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build --workspace=apps/frontend
    startCommand: npm run start --workspace=apps/frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: keyvalue
    name: zenhr-redis
    plan: standard
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  # Managed PostgreSQL 16
  - name: zenhr-postgres
    databaseName: zenhr_production
    user: zenhr_admin
    region: frankfurt
    postgresMajorVersion: '16'
