version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zenhr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenhr
      POSTGRES_PASSWORD: zenhr_secret
      POSTGRES_DB: zenhr_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zenhr -d zenhr_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zenhr_redis
    restart: unless-stopped
    command: redis-server --requirepass zenhr_redis_secret --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', 'zenhr_redis_secret', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
